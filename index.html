<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flatiron Task Lister</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="main-content">
    <h1>Task Lister Lite™️</h1>

    <!-- Form -->
    <form id="create-task-form" action="" method="POST">
      <label for="new-task-description">Task description:</label>
      <input type="text" id="new-task-description" name="new-task-description" placeholder="description" required>
      <input type="submit" value="Create New Task">
    </form>

    <!-- Task List -->
    <div id="list">
      <h2>My Todos:</h2>
      <ul id="tasks"></ul>
    </div>

    <script>
      
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("create-task-form");

        
        form.addEventListener("submit", (e) => {
          e.preventDefault(); 

          
          const taskObj = {
            task: e.target.elements["new-task-description"].value.trim()
          };

          
          if (taskObj.task) {
            buildToDo(taskObj.task);
          }

          
          e.target.reset();
        });
      });

    
      function buildToDo(task) {
      
        const li = document.createElement("li");

      
        li.textContent = task;

    
        const list = document.getElementById("tasks");
        list.appendChild(li);
      }
    </script>
  </div>
</body>
</html>
